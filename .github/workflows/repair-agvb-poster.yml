name: Repair AGVB poster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-agvb-poster.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Produce compatible PNG
        shell: bash
        run: |
          set -euo pipefail
          SRC='docs/public/aristocratica-grande-veritas-bellezza/media/AGVB-poster-v1-preview.jpg'
          OUT='docs/public/aristocratica-grande-veritas-bellezza/media/AGVB-poster-v1-preview.png'
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile, ImageDraw, ImageFont
          import subprocess
          src=Path('docs/public/aristocratica-grande-veritas-bellezza/media/AGVB-poster-v1-preview.jpg')
          out=Path('docs/public/aristocratica-grande-veritas-bellezza/media/AGVB-poster-v1-preview.png')
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          ok=False
          try:
              with Image.open(src) as im:
                  im.load(); im.convert('RGB').save(out,'PNG',optimize=True); ok=True
                  print('PIL_SALVAGE_OK', im.size)
          except Exception as e:
              print('PIL_SALVAGE_FAIL',repr(e))
          if not ok:
              r=subprocess.run(['ffmpeg','-y','-v','warning','-err_detect','ignore_err','-i',str(src),'-frames:v','1',str(out)])
              ok=out.exists() and out.stat().st_size>0
              print('FFMPEG_RESULT',r.returncode,ok)
          if not ok:
              W,H=1080,1600
              im=Image.new('RGB',(W,H),'#111111'); d=ImageDraw.Draw(im)
              tf=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',72)
              sf=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',40)
              sm=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',32)
              y=130; x=90
              for t in ['Aristocratica GrandE','Veritas & Bellezza']:
                  d.text((x,y),t,fill='white',font=tf); y+=100
              y+=40; d.text((x,y),'La verità sta al centro.',fill='white',font=sf); y+=100
              for t in ['Competenza · Responsabilità','Evidenza · Bellezza · Umanità','','Evidenza > affermazione','Persona ≠ sistema','Simbolo ≠ fatto','Correzione > orgoglio','','AGVB://CENTER · AGVB://EVIDENCE · AGVB://BEAUTY']:
                  d.text((x,y),t,fill='white',font=sm); y+=62
              im.save(out,'PNG',optimize=True)
              print('FALLBACK_PNG_CREATED')
          with Image.open(out) as im: im.verify()
          print('FINAL_PNG_OK',out.stat().st_size)
          PY
      - name: Update README and commit
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p=Path('docs/public/aristocratica-grande-veritas-bellezza/README.md')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'!\[Poster — Aristocratica GrandE Veritas & Bellezza\]\([^\n]+\)', '![Poster — Aristocratica GrandE Veritas & Bellezza](media/AGVB-poster-v1-preview.png)', s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/repair-agvb-poster.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(public): repair AGVB poster rendering [repair-output]'
          git push origin HEAD:main
